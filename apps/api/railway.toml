# Serviço `salomar-api` no Railway.
# Root directory do serviço: "/" (raiz do repo, para o npm workspaces enxergar o lockfile).
# Config file path do serviço: /apps/api/railway.toml
[build]
builder = "RAILPACK"
buildCommand = "npm run build -w @salomar/api"
watchPatterns = ["apps/api/**", "package.json", "package-lock.json"]

[deploy]
# Roda uma vez por deploy, antes de trocar o tráfego. Se falhar, o deploy antigo continua no ar.
preDeployCommand = ["npm run prisma:migrate -w @salomar/api"]
startCommand = "node apps/api/dist/main.js"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
